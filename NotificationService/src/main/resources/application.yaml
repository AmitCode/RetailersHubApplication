spring:
  application:
    name: notification-application

  profiles:
    active: oracleDB

  config:
    import: "optional:configserver:http://localhost:8092/"

endpoints:
  shutdown:
    enabled: true
  health:
    probes:
      enable: true


management:
  tags:
    application: ${spring:application:name}
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    readiness-state:
      enable: true
    liveness-state:
      enable: true
  shutdown:
    enabled: true
  env:
    enabled: true

eureka:
  instance:
    preferIpAddress: true
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8070/eureka/
info:
  app:
    name: "notification-application"
    description: "Retailers Hub Application's Notification microservice"
    version: "1.0.0"
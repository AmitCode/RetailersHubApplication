services:

  # ============================================================
  # AUTH SERVICE DATABASE
  # ============================================================
  auth_servicedb:
    container_name: auth_servicedb
    image: mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: authentication_services_database
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - retailershub


  # ============================================================
  # USER SERVICE DATABASE
  # ============================================================
  user_servicedb:
    container_name: user_servicedb
    image: mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: user_services_database
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - retailershub


  # ============================================================
  # NOTIFICATION SERVICE DATABASE
  # ============================================================
  notification_servicedb:
    container_name: notification_servicedb
    image: mysql
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: notification_services_database
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - retailershub

  # ============================================================
  # PROMETHEUS
  # ============================================================
  prometheus:
    image: prom/prometheus:v3.8.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

    networks:
      - retailershub

    deploy:
      resources:
        limits:
          memory: 700m

  # ============================================================
  # SPRING CLOUD CONFIG SERVER
  # ============================================================
  redis:
    image: redis
    ports:
      - "6379:6379"

    healthcheck:
      test: [ "CMD-SHELL", "redis-cli ping | grep PONG" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - retailershub

    deploy:
      resources:
        limits:
          memory: 700m

  # ============================================================
  # SPRING CLOUD CONFIG SERVER
  # ============================================================
  configserver:
    image: "amitcodedocker/configservice:configsv4"
    container_name: configserver
    ports:
      - "8092:8092"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8092/actuator/health/readiness || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - retailershub

    deploy:
      resources:
        limits:
          memory: 700m


  # ============================================================
  # EUREKA SERVICE DISCOVERY
  # ============================================================
  eurekaserver:
    image: "amitcodedocker/servicediscoveryeureka:eurekav3"
    container_name: eurekaserver-ms
    ports:
      - "8070:8070"

    depends_on:
      configserver:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8070/actuator/health/readiness || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - retailershub

    environment:
      SPRING_APPLICATION_NAME: "service-discovery-eureka"
      SPRING_CONFIG_IMPORT: "configserver:http://configserver:8092/"

    deploy:
      resources:
        limits:
          memory: 700m


  # ============================================================
  # AUTHENTICATION SERVICE
  # ============================================================
  authenticationservice:
    image: "amitcodedocker/authenticationservice:authsv6"
    container_name: authentication-ms
    ports:
      - "8089:8089"

    depends_on:
      auth_servicedb:
        condition: service_healthy

      configserver:
        condition: service_healthy

      eurekaserver:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8089/authService/actuator/health/readiness || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - retailershub

    environment:
      SPRING_APPLICATION_NAME: "auth-application"
      SPRING_CONFIG_IMPORT: "configserver:http://configserver:8092/"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eurekaserver:8070/eureka/"
      SPRING_PROFILES_ACTIVE: "myNewDB"

    deploy:
      resources:
        limits:
          memory: 700m


  # ============================================================
  # USER SERVICE
  # ============================================================
  userservice:
    image: "amitcodedocker/userservice:userdevsv6"
    container_name: user-ms
    ports:
      - "8088:8088"

    depends_on:
      user_servicedb:
        condition: service_healthy

      configserver:
        condition: service_healthy

      eurekaserver:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8088/userService/actuator/health/readiness || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - retailershub

    environment:
      SPRING_APPLICATION_NAME: "userservice-application"
      SPRING_CONFIG_IMPORT: "configserver:http://configserver:8092/"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eurekaserver:8070/eureka/"
      SPRING_PROFILES_ACTIVE: "mysqlDB1"

    deploy:
      resources:
        limits:
          memory: 700m


  # ============================================================
  # NOTIFICATION SERVICE
  # ============================================================
  notificationservice:
    image: "amitcodedocker/notificationservice:nsdevv6"
    container_name: notification-ms
    ports:
      - "8090:8090"

    depends_on:
      notification_servicedb:
        condition: service_healthy

      configserver:
        condition: service_healthy

      eurekaserver:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8090/actuator/health/readiness || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - retailershub

    environment:
      SPRING_APPLICATION_NAME: "notification-application"
      SPRING_CONFIG_IMPORT: "configserver:http://configserver:8092/"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eurekaserver:8070/eureka/"
      SPRING_PROFILES_ACTIVE: "mysqlDB1"

    deploy:
      resources:
        limits:
          memory: 700m


  # ============================================================
  # API GATEWAY
  # ============================================================
  apigatewayserver:
    image: "amitcodedocker/apigatewayserver:apigsv2"
    container_name: apigatewayserver-ms
    ports:
      - "8072:8072"

    depends_on:
      authenticationservice:
        condition: service_healthy

      userservice:
        condition: service_healthy

      notificationservice:
        condition: service_healthy

      redis:
        condition: service_healthy

    networks:
      - retailershub

    environment:
      SPRING_APPLICATION_NAME: "apigatewayserver"
      SPRING_CONFIG_IMPORT: "configserver:http://configserver:8092/"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eurekaserver:8070/eureka/"
      SPRING_PROFILES_ACTIVE: "default"
      SPRING_DATA_REDIS_CONNECT-TIMEOUT: 2s
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_TIMEOUT: 1s

    deploy:
      resources:
        limits:
          memory: 700m

  # ============================================================
  # LOKI READ SERVICE
  # ============================================================
  read:
    image: grafana/loki:latest
    command: "-config.file=/etc/loki/config.yaml -target=read -query-scheduler.use-scheduler-ring=false"
    ports:
      - 3101:3100
      - 7946
      - 9095
    volumes:
      - ../observability/loki/loki-config.yaml:/etc/loki/config.yaml
    depends_on:
      - minio
    healthcheck:
      test: [ "CMD", "/usr/bin/loki", "-health" ]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5
    networks: &loki-dns
      retailershub:
        aliases:
          - loki

  # ============================================================
  # LOKI WRITE SERVICE
  # ============================================================
  write:
    image: grafana/loki:latest
    command: "-config.file=/etc/loki/config.yaml -target=write"
    ports:
      - 3102:3100
      - 7946
      - 9095
    volumes:
      - ../observability/loki/loki-config.yaml:/etc/loki/config.yaml
    healthcheck:
      test: [ "CMD", "/usr/bin/loki", "-health" ]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - minio
    networks:
      <<: *loki-dns

  # ============================================================
  # GRAFANA ALLOY
  # ============================================================
  alloy:
    image: grafana/alloy:latest
    volumes:
      - ../observability/alloy/alloy-local-config.yaml:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    ports:
      - 12345:12345
    depends_on:
      - gateway
    networks:
      - retailershub

  # ============================================================
  # MINIO OBJECT STORAGE
  # ============================================================
  minio:
    image: elestio/minio
    entrypoint:
      - sh
      - -euc
      - |
        mkdir -p /data/loki-data && \
        mkdir -p /data/loki-ruler && \
        minio server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=loki
      - MINIO_ROOT_PASSWORD=supersecret
      - MINIO_PROMETHEUS_AUTH_TYPE=public
      - MINIO_UPDATE=off
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./.data/minio:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 15s
      timeout: 20s
      retries: 5
    networks:
      - retailershub

  # ============================================================
  # GRAFANA
  # ============================================================
  grafana:
    image: grafana/grafana:12.3.0
    environment:
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    depends_on:
      - gateway
    entrypoint:
      - sh
      - -euc
      - |
        /run.sh
    ports:
      - "3000:3000"
    volumes:
      - ../observability/grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - retailershub

  # ============================================================
  # LOKI BACKEND SERVICE
  # ============================================================
  backend:
    image: grafana/loki:latest
    volumes:
      - ../observability/loki/loki-config.yaml:/etc/loki/config.yaml
    ports:
      - "3100"
      - "7946"
    command: "-config.file=/etc/loki/config.yaml -target=backend -legacy-read-mode=false"
    depends_on:
      - gateway
    healthcheck:
      test: [ "CMD", "/usr/bin/loki", "-health" ]
      start_period: 30s
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - retailershub

  # ============================================================
  # LOKI API GATEWAY
  # ============================================================
  gateway:
    image: nginx:latest
    depends_on:
      - read
      - write
    entrypoint:
      - sh
      - -euc
      - |
        cat <<EOF > /etc/nginx/nginx.conf
        user  nginx;
        worker_processes  5;  ## Default: 1

        events {
          worker_connections   1000;
        }

        http {
          resolver 127.0.0.11;

          server {
            listen             3100;

            location = / {
              return 200 'OK';
              auth_basic off;
            }

            location = /api/prom/push {
              proxy_pass       http://write:3100\$$request_uri;
            }

            location = /api/prom/tail {
              proxy_pass       http://read:3100\$$request_uri;
              proxy_set_header Upgrade \$$http_upgrade;
              proxy_set_header Connection "upgrade";
            }

            location ~ /api/prom/.* {
              proxy_pass       http://read:3100\$$request_uri;
            }

            location = /loki/api/v1/push {
              proxy_pass       http://write:3100\$$request_uri;
            }

            location = /loki/api/v1/tail {
              proxy_pass       http://read:3100\$$request_uri;
              proxy_set_header Upgrade \$$http_upgrade;
              proxy_set_header Connection "upgrade";
            }

            location ~ /loki/api/.* {
              proxy_pass       http://read:3100\$$request_uri;
            }
          }
        }
        EOF
        /docker-entrypoint.sh nginx -g "daemon off;"
    ports:
      - "3100:3100"
    healthcheck:
      test: [ "CMD", "service", "nginx", "status" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - retailershub
# ==============================================================
# NETWORK
# ==============================================================
networks:
  retailershub:
    driver: bridge
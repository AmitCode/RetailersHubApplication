spring:
  application:
    name: RetailersHubConfigServer

  profiles:
    active: git

  cloud:
    config:
      server:
        git:
          uri: "https://github.com/AmitCode/RetailersHubApplication.git"
          default-label: feature/api-gateway-resilience
          search-paths:
            - RetailersHubAppConfigFiles
          timeout: 5
          clone-on-start: true
          force-pull: true
#encrypt:
#  key: "mJjadcJjvVSD7S8U+rinek8X72WU6O3CZ4jeJAfWi8s="
server:
  port: 8092
management:
  endpoints:
    web:
      exposure:
        include: "*"
  tags:
    application: ${spring:application:name}
  health:
    readiness-state:
      enable: true
    liveness-state:
      enable: true
    endpoint:
      health:
        probes:
          enable: true

#OpenTelemetry properties
logging:
  pattern:
    level: "%5p [${spring.application.name},%X{trace_id},%X{span_id}]"
  level:
    root: DEBUG



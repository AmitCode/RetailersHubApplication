spring:
  application:
    name: service-discovery-eureka
  config:
    import: "optional:configserver:http://localhost:8092/"
server:
  port: 8070
management:
  endpoints:
    web:
      exposure:
        include: "*"
  tags:
    application: ${spring:application:name}
  health:
    readiness-state:
      enable: true
    liveness-state:
      enable: true
    endpoint:
      health:
        probes:
          enable: true

#OpenTelemetry properties
logging:
  pattern:
    level: "%5p [${spring.application.name},%X{trace_id},%X{span_id}]"
  level:
    root: DEBUG

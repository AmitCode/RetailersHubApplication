spring:
  application:
    name: service-discovery-eureka
  config:
    import: "optional:configserver:http://localhost:8092/"
server:
  port: 8070
management:
  endpoints:
    web:
      exposure:
        include: "*"
  tags:
    application: ${spring:application:name}
  health:
    readiness-state:
      enable: true
    liveness-state:
      enable: true
    endpoint:
      health:
        probes:
          enable: true

#OpenTelemetry properties
logging:
  pattern:
    console: "${CONSOLE_LOG_PATTERN:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %cyan(%msg%n)}"

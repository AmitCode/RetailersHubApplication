spring:
  application:
    name: service-discovery-eureka
  config:
    import: "optional:configserver:http://localhost:8092/"
server:
  port: 8070
management:
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    readiness-state:
      enable: true
    liveness-state:
      enable: true
    endpoint:
      health:
        probes:
          enable: true

apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentication-deployment
  namespace: retailershub
  labels:
    app: authentication
    app.kubernetes.io/name: authentication
    app.kubernetes.io/part-of: retailershub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: authentication
  template:
    metadata:
      labels:
        app: authentication
        app.kubernetes.io/name: authentication
        app.kubernetes.io/part-of: retailershub
    spec:
      containers:
      - name: authentication
        image: amitcodedocker/authenticationservice:authsv7
        imagePullPolicy: Always
        ports:
        - containerPort: 8089
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: myNewDB
        - name: SPRING_CONFIG_IMPORT
          valueFrom:
            configMapKeyRef:
              name: retailershub-configmap
              key: SPRING_CONFIG_IMPORT
        - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
          valueFrom:
            configMapKeyRef:
              name: retailershub-configmap
              key: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
        - name: MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: retailershub-configmap
              key: OTLP_TRACES_ENDPOINT
        - name: MANAGEMENT_OPENTELEMETRY_LOGGING_EXPORT_OTLP_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: retailershub-configmap
              key: OTLP_LOGS_ENDPOINT
        - name: MANAGEMENT_OTLP_METRICS_EXPORT_URL
          valueFrom:
            configMapKeyRef:
              name: retailershub-configmap
              key: OTLP_METRICS_ENDPOINT
        resources:
          requests:
            cpu: 250m
            memory: 384Mi
          limits:
            cpu: 500m
            memory: 700Mi
        startupProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8089
          failureThreshold: 60
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8089
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8089
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: authentication
  namespace: retailershub
  labels:
    app: authentication
    app.kubernetes.io/name: authentication
    app.kubernetes.io/part-of: retailershub
spec:
  selector:
    app: authentication
  type: LoadBalancer
  ports:
    - protocol: TCP
      port: 8089
      targetPort: 8089

spring:
  application:
    name: apigatewayserver

  config:
    import: "optional:configserver:http://localhost:8092/"
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lowerCaseServiceId: true
          httpclient:
            connect-timeout: 1000
            response-timeout: 10s
  data:
    redis:
      connect-timeout: 2s
      host: localhost
      port: 6379
      timeout: 2s

management:
  endpoints:
    web:
      exposure:
        include: "*"
  env:
    enabled: true
  endpoint:
    gateway:
      enabled: true
info:
  app:
    name: "Api Gateway Server"
    description: "Retailers Hub Application's Api Gateway Server"
    version: "1.0.0"

#Circuit Breaker related dependencies.
resilience4j.circuitbreaker:
  configs:
    default:
      slidingWindowSize: 10
      permittedNumberOfCallsInHalfOpenState: 2
      failureRateThreshold: 50
      waitDurationInOpenState: 10000
spring:
  application:
    name: apigatewayserver

  config:
    import: "optional:configserver:http://localhost:8092/"
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lowerCaseServiceId: true
          httpclient:
            connect-timeout: 1000
            response-timeout: 10s
  data:
    redis:
      connect-timeout: 2s
      host: localhost
      port: 6379
      timeout: 2s

#  security:
#    oauth2:
#      resourceserver:
#        jwt:
#          jwk-set-uri: "http://localhost:7080/realms/master/protocol/openid-connect/certs"

management:
  endpoints:
    web:
      exposure:
        include: "*"
  tags:
    application: ${spring:application:name}
  env:
    enabled: true
  endpoint:
    gateway:
      enabled: true
info:
  app:
    name: "Api Gateway Server"
    description: "Retailers Hub Application's Api Gateway Server"
    version: "1.0.0"

#Circuit Breaker related dependencies.
resilience4j.circuitbreaker:
  configs:
    default:
      slidingWindowSize: 10
      permittedNumberOfCallsInHalfOpenState: 2
      failureRateThreshold: 50
      waitDurationInOpenState: 10000

#OpenTelemetry properties
logging:
  pattern:
    console: "${CONSOLE_LOG_PATTERN:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %cyan(%msg%n)}"
#  level:
#    root: DEBUG